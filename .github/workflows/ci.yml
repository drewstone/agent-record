name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Retain a short-lived renderer preview
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: agent-record-preview-${{ github.sha }}
          path: dist/
          retention-days: 1
